name: Bug report / 问题报告
description: Report a reproducible problem in the host, client, discovery, runtime, or documentation / 报告宿主、客户端、发现、运行时或文档中的可复现问题
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a problem. Please remove secrets, private URLs, session content, and personal data before submitting.

        感谢你报告问题。提交前请删除秘密信息、私有 URL、会话内容和个人数据。

  - type: textarea
    id: summary
    attributes:
      label: Summary / 问题概述
      description: What happened, and where did it happen? / 发生了什么，在哪个功能或页面发生？
      placeholder: Describe the problem in one or two sentences. / 用一两句话描述问题。
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area / 影响区域
      options:
        - Host runtime or Cordis integration / 宿主运行时或 Cordis 集成
        - Catalog discovery or source management / 目录发现或源管理
        - MCP, hooks, commands, or skills injection / MCP、hooks、命令或技能注入
        - Web UI or client bundle / Web UI 或客户端构建
        - Documentation or website / 文档或网站
        - Build, packaging, or CI / 构建、打包或 CI
        - Other / 其他
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit / 版本或提交
      description: Include the package version or the commit you tested. / 填写测试使用的包版本或提交。
      placeholder: '0.4.6 or abc1234'
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment / 环境
      description: Include OS, Node.js, pnpm, DSH version, and relevant profile details. / 提供操作系统、Node.js、pnpm、DSH 版本和相关 profile 信息。
      placeholder: |
        OS:
        Node.js:
        pnpm:
        DSH:
        Profile:
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Give the smallest reliable sequence of steps. / 提供最小且稳定的复现步骤。
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 期望行为
      description: What did you expect to happen? / 你期望发生什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际行为
      description: What happened instead? Include exact errors when possible. / 实际发生了什么？如可能请提供完整错误信息。
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots / 日志或截图
      description: Redact tokens, cookies, local paths, private URLs, and session content. / 请脱敏 token、cookie、本地路径、私有 URL 和会话内容。
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks / 提交前确认
      options:
        - label: I searched existing issues and did not find a duplicate. / 我已搜索现有 issue，确认不是重复问题。
          required: true
        - label: I can reproduce this on the latest relevant version or commit. / 我能在最新相关版本或提交上复现此问题。
          required: true
        - label: I removed secrets and other private information. / 我已删除秘密信息和其他隐私内容。
          required: true
