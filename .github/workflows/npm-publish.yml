name: npm-publish

# Triggered by version tags pushed by release-please.
# We use 'push: tags' instead of 'on: release' because releases created
# by github-actions[bot] (release-please) do NOT trigger the 'release'
# workflow event — GitHub prevents this to avoid recursive runs.
on:
  push:
    tags:
      - 'dsh-agent-plugins-market-v*'

# id-token: write is required for npm trusted publishing (OIDC).
# No NPM_TOKEN secret needed — npm issues a short-lived OIDC token per run.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the environment name configured in the npm trusted publisher settings.
    environment: npm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full quality gates
        run: pnpm run check:refactor && pnpm run test

      - name: Build published artifacts
        run: pnpm run build

      - name: Publish to npm via OIDC trusted publishing
        # --provenance attaches the build attestation; npm authenticates
        # via the OIDC token issued by GitHub Actions, not a static token.
        run: pnpm publish --no-git-checks --provenance
