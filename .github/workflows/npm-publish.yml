name: npm-publish

# Triggered after the release-please workflow completes successfully.
# We use workflow_run instead of 'on: release' or 'on: push: tags' because
# events generated by github-actions[bot] (which release-please uses) do not
# trigger other workflows — GitHub prevents this to avoid recursive runs.
on:
  workflow_run:
    workflows: [release-please]
    types: [completed]

# id-token: write is required for npm trusted publishing (OIDC).
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Only run if the release-please workflow succeeded.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    # Must match the environment name configured in npm trusted publisher settings.
    environment: npm
    steps:
      - name: Check if a release was created
        id: check-release
        run: |
          TAG=$(gh api /repos/${{ github.repository }}/releases/latest --jq '.tag_name' 2>/dev/null || echo "")
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          if [ -n "$TAG" ]; then
            echo "release_created=true" >> $GITHUB_OUTPUT
          else
            echo "release_created=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check out repository
        if: steps.check-release.outputs.release_created == 'true'
        uses: actions/checkout@v4

      - name: Set up pnpm
        if: steps.check-release.outputs.release_created == 'true'
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        if: steps.check-release.outputs.release_created == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        if: steps.check-release.outputs.release_created == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run full quality gates
        if: steps.check-release.outputs.release_created == 'true'
        run: pnpm run check:refactor && pnpm run test

      - name: Build published artifacts
        if: steps.check-release.outputs.release_created == 'true'
        run: pnpm run build

      - name: Publish to npm via OIDC trusted publishing
        if: steps.check-release.outputs.release_created == 'true'
        run: pnpm publish --no-git-checks --provenance
